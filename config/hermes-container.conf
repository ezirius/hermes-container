# Hermes Container settings. This file is read as data, never run as a script.
# Use NAME=value. Spaces inside values are literal; do not add quotes.
# Put comments on their own lines. Every setting below is required.
# Usually only paths, ports and container resources need editing.
# Stop Hermes before changing paths, ports, resources or image sources.

# Standard directories to search for trusted tools, in order.
TRUSTED_PATH=/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
# Additional trusted tool owners, separated by spaces. Root and the current
# user are always trusted. Leave empty to trust only root and the current user.
# Tools must still not be group/world writable.
TRUSTED_TOOL_USERS=ezirius

# Release sources. Docker Hub supplies the image; GitHub supplies release dates.
IMAGE_REPOSITORY=nousresearch/hermes-agent
RELEASE_REPOSITORY=NousResearch/hermes-agent

# Advanced: compatible registry/release services. Keep these defaults for Hermes.
# API origins use HTTPS, without a path or trailing slash.
IMAGE_REGISTRY=docker.io
RELEASE_API_ORIGIN=https://api.github.com
REGISTRY_API_ORIGIN=https://registry-1.docker.io
REGISTRY_AUTH_ORIGIN=https://auth.docker.io
REGISTRY_AUTH_SERVICE=registry.docker.io
# Release items per page: 1 to 100.
RELEASE_PAGE_SIZE=100

# Host storage. WORKSPACE_BASE is absolute.
# Home, Backups and Agent Docs are relative to the selected workspace.
# User Docs is relative to the account home; {workspace} inserts its name.
WORKSPACE_BASE=/Volumes/Data
# Allow group write on a root-owned workspace base shared by several accounts.
# This applies only to the base, never to individual workspaces or Hermes data.
# World write is always refused. Existing ACLs are preserved, not managed here.
WORKSPACE_BASE_ALLOW_GROUP_WRITE=true
HOME_PATH=Apps Data/Hermes/Home
BACKUPS_PATH=Apps Data/Hermes/Backups
AGENT_DOCS_PATH=Apps Data/Hermes/Agent Docs
USER_DOCS_PATH=Documents/{workspace}/Apps Data/Hermes/User Docs

# Dashboard host ports. Add login:port entries; keep one default:port entry.
# Host access always stays on loopback.
DASHBOARD_PORTS=ezirius:19119 nala:29119 default:59119
DASHBOARD_CONTAINER_PORT=9119
# CPU count is a whole number. Memory sizes use m (MiB) or g (GiB).
CONTAINER_CPUS=1
CONTAINER_MEMORY=2g
CONTAINER_SHM_SIZE=512m
RESTART_POLICY=unless-stopped
# Used only when your terminal has not supplied TERM.
DEFAULT_TERM=xterm

# Host requirements are project policy, not automatic upgrade instructions.
MIN_MACOS_ARM64=27
MIN_MACOS_AMD64=15
MIN_PODMAN_ARM64=6.1.1
MIN_PODMAN_MACOS_AMD64=5.8.3
MIN_PODMAN_LINUX_AMD64=6.1.1
MIN_JQ=1.7
MIN_SERVICE_RELEASE=v2026.9.14
MIN_ENGINE_CPUS=2
MIN_ENGINE_MEMORY_MIB=6144

# Storage reserves, in whole GiB. These checks do not reserve disk space.
CACHED_IMAGE_FREE_GIB=3
NEW_IMAGE_FREE_GIB=10
BACKUP_RESERVE_GIB=1
RESTORE_RESERVE_GIB=1
BACKUP_RETENTION_DAYS=14

# Time limits in seconds, except the explicitly named millisecond setting.
INSPECT_TIMEOUT=10
RELEASE_TIMEOUT=10
HTTP_CONNECT_TIMEOUT=3
PULL_TIMEOUT=1800
MAINTENANCE_TIMEOUT=1800
ZIP_LIST_TIMEOUT=30
ZIP_TEST_TIMEOUT=120
SERVICE_START_TIMEOUT=90
SERVICE_RESTART_TIMEOUT=60
SERVICE_CONTROL_TIMEOUT=15
GATEWAY_STOP_TIMEOUT=60
CONTAINER_STOP_TIMEOUT=45
CONTAINER_STOP_GRACE=30
DASHBOARD_STOP_TIMEOUT_MS=10000
DASHBOARD_ATTEMPTS=20
DASHBOARD_POLL_SECONDS=1
DASHBOARD_CONNECT_TIMEOUT=1
DASHBOARD_HTTP_TIMEOUT=2
DASHBOARD_CAPTURE_TIMEOUT=3
# Process supervision intervals; fractions of a second are allowed.
PROCESS_POLL_SECONDS=0.05
# After cancellation or timeout, wait this long before killing the local child.
CHILD_TERM_GRACE_SECONDS=0.1

# Input and captured output limits, in bytes unless named otherwise.
# Oversized or deeply nested input is refused.
MAX_JSON_BYTES=8388608
MAX_STDOUT_BYTES=8388608
MAX_JSON_DEPTH=64
MAX_STDERR_BYTES=1048576
MAX_HTTP_HEADER_BYTES=65536
MAX_TOKEN_BYTES=8192
MAX_PATH_STEPS=64
